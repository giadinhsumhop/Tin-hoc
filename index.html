['📊','Thông tin và dữ liệu',`<ul><li><b>Dữ liệu</b> là các giá trị thô (số, chữ, hình ảnh, âm thanh). <b>Thông tin</b> là ý nghĩa rút ra từ dữ liệu: 38,5 là dữ liệu, "bạn đang sốt" là thông tin.</li><li>Đơn vị nhỏ nhất là <b>bit</b> (0 hoặc 1). 1 byte = 8 bit; 1 KB = 1024 byte; 1 MB = 1024 KB; 1 GB = 1024 MB.</li><li>Thông tin tốt cần chính xác, đầy đủ và kịp thời.</li></ul>`],
['🔢','Biểu diễn thông tin trong máy tính',`<p>Máy tính dùng <b>hệ nhị phân</b> (chỉ có 0 và 1) vì dễ tạo ra bằng hai trạng thái bật và tắt. Chữ, số, hình ảnh, âm thanh đều được mã hoá thành dãy bit.</p><ul><li>Đổi nhị phân sang thập phân: cộng các giá trị vị trí có bit 1. 1011₂ = 8 + 2 + 1 = 11.</li><li>Mã ASCII: chữ A có mã 65 = 01000001₂.</li></ul><p class="tip">💡 Thử công cụ A trong tab Thực hành để tự bật tắt từng bit.</p>`],

['🌐','Mạng máy tính và Internet',`<ul><li><b>Mạng máy tính:</b> nhiều thiết bị nối với nhau để trao đổi dữ liệu. LAN là mạng nhỏ (nhà, trường), WAN là mạng rộng.</li><li><b>Internet</b> là mạng của các mạng trên toàn cầu. Router nối mạng của bạn với Internet.</li><li>Mỗi thiết bị có <b>địa chỉ IP</b>, mỗi trang web có <b>URL</b> và được xem bằng trình duyệt.</li><li>Dịch vụ: WWW, thư điện tử, tìm kiếm, học trực tuyến.</li></ul>`],
['🔐','An toàn thông tin và đạo đức',`<ul><li><b>Mật khẩu mạnh:</b> từ 8 kí tự, có chữ hoa, chữ thường, số, kí tự đặc biệt, không dùng ngày sinh. Không chia sẻ mật khẩu.</li><li>Cảnh giác <b>lừa đảo</b> (phishing): không bấm liên kết lạ, không đưa thông tin cá nhân.</li><li>Sao lưu dữ liệu quan trọng. Tôn trọng <b>bản quyền</b>. Không bắt nạt trên mạng.</li></ul><p class="tip">💡 Trước khi đăng gì lên mạng, hãy tự hỏi: có ai bị tổn thương không?</p>`],
['📈','Phần mềm bảng tính',`<ul><li>Ô = cột + hàng, ví dụ <b>C5</b>. Công thức bắt đầu bằng dấu <b>=</b>: =A1+B1.</li><li>Hàm: <b>SUM</b> (tổng), <b>AVERAGE</b> (trung bình), <b>MAX</b>, <b>MIN</b>, <b>COUNT</b> (đếm ô chứa số). Vùng dữ liệu viết A1:A5.</li><li>Địa chỉ <b>tương đối</b> (A1) đổi khi sao chép công thức, địa chỉ <b>tuyệt đối</b> ($A$1) giữ nguyên.</li></ul><p class="tip">💡 Luyện hàm ở công cụ B.</p>`],

chp('#qc',Object.entries(ST),()=>qt,k=>qt=k);chp('#qn',[[10,'10 câu'],[20,'20 câu'],[30,'30 câu']],()=>qn,k=>qn=+k);$('#go').onclick=begin;return}
if(qi>=qs.length){const b=Math.max(best(qt),sc);best(qt,b);

if(sc==qs.length)spawn('🎉',10);const pct=sc/qs.length*100;
